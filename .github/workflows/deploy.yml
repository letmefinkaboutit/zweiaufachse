name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate project files
        shell: bash
        run: |
          test -f index.html
          test -f src/main.js
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          if command -v php >/dev/null; then
            find api bilderupload -name "*.php" -print0 | xargs -0 -n1 php -l
          fi

      # Zugangsdaten kommen aus GitHub-Secrets und werden beim Deploy in die
      # Server-Configs geschrieben. Sie landen NIE im Repo (beide gitignored).
      # Fehlt ein Secret, laeuft die App weiter im jeweiligen Fallback.
      - name: Traccar-Config aus Secrets erzeugen
        shell: bash
        env:
          TRACCAR_TOKEN: ${{ secrets.TRACCAR_TOKEN }}
          TRACCAR_EMAIL: ${{ secrets.TRACCAR_EMAIL }}
          TRACCAR_PASSWORD: ${{ secrets.TRACCAR_PASSWORD }}
          TRACCAR_DEVICE_ID: ${{ secrets.TRACCAR_DEVICE_ID }}
          TRACCAR_BASE_URL: ${{ secrets.TRACCAR_BASE_URL }}
        run: |
          DEVICE_ID="${TRACCAR_DEVICE_ID:-88031483}"
          BASE_URL="${TRACCAR_BASE_URL:-https://server.traccar.org/api}"
          if [ -n "$TRACCAR_TOKEN" ]; then
            # API-Token aus Traccar Cloud — funktioniert direkt gegen /api/devices.
            printf "<?php\nreturn [\n    'base_url' => '%s',\n    'auth'     => ['mode' => 'bearer', 'email' => '', 'password' => '', 'token' => '%s'],\n    'device'   => ['unique_id' => '%s'],\n    'timezone' => 'Europe/Berlin',\n];\n" \
              "$BASE_URL" "$TRACCAR_TOKEN" "$DEVICE_ID" > api/traccar-config.php
            echo "Traccar-Config erzeugt (Token Auth, Geraet $DEVICE_ID, Server $BASE_URL)"
          elif [ -n "$TRACCAR_EMAIL" ] && [ -n "$TRACCAR_PASSWORD" ]; then
            # E-Mail + Passwort (Basic Auth) — funktioniert bei Traccar zuverlaessig.
            printf "<?php\nreturn [\n    'base_url' => '%s',\n    'auth'     => ['mode' => 'basic', 'email' => '%s', 'password' => '%s', 'token' => ''],\n    'device'   => ['unique_id' => '%s'],\n    'timezone' => 'Europe/Berlin',\n];\n" \
              "$BASE_URL" "$TRACCAR_EMAIL" "$TRACCAR_PASSWORD" "$DEVICE_ID" > api/traccar-config.php
            echo "Traccar-Config erzeugt (Basic Auth, Geraet $DEVICE_ID, Server $BASE_URL)"
          else
            # Kein gueltiger Token: stumme Config, die Traccar NICHT kontaktiert.
            # Ueberschreibt eine evtl. vorhandene alte Config auf dem Server.
            printf "<?php\nreturn [\n    'base_url' => '%s',\n    'auth'     => ['mode' => 'disabled', 'email' => '', 'password' => '', 'token' => ''],\n    'device'   => ['unique_id' => '%s'],\n    'timezone' => 'Europe/Berlin',\n];\n" \
              "$BASE_URL" "$DEVICE_ID" > api/traccar-config.php
            echo "::warning::TRACCAR_TOKEN fehlt — Traccar deaktiviert (stumme Config, kein API-Versuch)."
          fi
          php -l api/traccar-config.php

      - name: Strava-Config aus Secrets erzeugen
        shell: bash
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_TRIP_START: ${{ secrets.STRAVA_TRIP_START }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ] || [ -z "$STRAVA_CLIENT_SECRET" ] || [ -z "$STRAVA_REFRESH_TOKEN" ]; then
            echo "::warning::Strava-Secrets fehlen — Chip zeigt 'noch nicht verbunden'."
            exit 0
          fi
          TRIP_START="${STRAVA_TRIP_START:-2026-07-19}"
          printf "<?php\nreturn [\n    'client_id'     => '%s',\n    'client_secret' => '%s',\n    'refresh_token' => '%s',\n    'trip_start'    => '%s',\n];\n" \
            "$STRAVA_CLIENT_ID" "$STRAVA_CLIENT_SECRET" "$STRAVA_REFRESH_TOKEN" "$TRIP_START" > api/strava-config.php
          php -l api/strava-config.php
          echo "Strava-Config erzeugt"

      # Temporaer bis Tour-Ende: sichtbare Versionsanzeige unten rechts,
      # damit klar ist, welcher Stand live ist.
      - name: Stamp deploy version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:7} · $(TZ='Europe/Berlin' date '+%d.%m. %H:%M')"
          sed -i "s|<div class=\"deploy-version\">lokal</div>|<div class=\"deploy-version\">${VERSION}</div>|" index.html
          grep -q "deploy-version\">${GITHUB_SHA:0:7}" index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ftp
          server-dir: /
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
            .github/**
            README.md
