<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Timo & Tino on Tour</title>
<meta name="description" content="Live dabei auf der Radreise von Schorndorf nach Griechenland." />
<meta name="theme-color" content="#0c6b58" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="T&T Tour" />
<link rel="stylesheet" href="./src/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="./src/styles/app.css" />
<script src="./src/vendor/leaflet/leaflet.js" defer></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    font-family: "Avenir Next", "Trebuchet MS", sans-serif;
    color: #1f2a2f;
    background:
      radial-gradient(circle at top left, rgba(235, 143, 52, 0.18), transparent 32%),
      linear-gradient(180deg, #fff9f0 0%, #f7f1e7 48%, #f2efe8 100%);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .scene-wrap {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 10px 26px rgba(29, 35, 38, 0.12);
  }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── Pseudo-3D ── */
  .fly {
    transform-box: view-box; transform-origin: 400px 560px;
    animation: fly var(--dur, 5.2s) linear infinite;
    animation-delay: var(--delay, 0s); opacity: 0;
  }
  @keyframes fly {
    0% { transform: scale(0.05); opacity: 0; }
    6% { opacity: 1; }
    62% { transform: scale(1.6); }
    100% { transform: scale(11); opacity: 1; }
  }
  .fly-dash {
    transform-box: view-box; transform-origin: 400px 560px;
    animation: flydash 3.2s linear infinite;
    animation-delay: var(--delay, 0s); opacity: 0;
  }
  @keyframes flydash {
    0% { transform: scale(0.08, 0.08); opacity: 0; }
    8% { opacity: 0.7; }
    62% { transform: scale(1.3, 1.9); }
    100% { transform: scale(4.5, 13); opacity: 0.7; }
  }

  .spokes, .crank { animation: spin var(--wheel, 0.82s) linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .timo { transform-box: view-box; transform-origin: 400px 1000px; animation: sway 1.7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
  .calf-l { animation: pedal var(--pedal, 0.42s) ease-in-out infinite alternate; }
  .calf-r { animation: pedal var(--pedal, 0.42s) ease-in-out infinite alternate-reverse; }
  @keyframes pedal { from { transform: translateY(0); } to { transform: translateY(-16px); } }
  .cockpit { animation: cockpitbob 0.48s ease-in-out infinite alternate; }
  @keyframes cockpitbob { to { transform: translateY(2px); } }
  .cloud-drift { animation: drift 90s linear infinite; }
  @keyframes drift { to { transform: translateX(-900px); } }
  .glint { animation: glint 3.2s ease-in-out infinite; }
  @keyframes glint { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }

  /* ── Zustaende ── */
  .night-veil, .stars, .moon, .camp { opacity: 0; transition: opacity 1.4s ease; }
  .sun-group, .timo { transition: opacity 1.3s ease; }
  .scene--night .night-veil, .scene--night .stars, .scene--night .moon, .scene--night .camp { opacity: 1; }
  .scene--night .sun-group, .scene--night .timo { opacity: 0; }
  .scene--night .fly, .scene--night .fly-dash, .scene--night .calf-l, .scene--night .calf-r,
  .scene--night .cockpit, .scene--night .cloud-drift { animation-play-state: paused; }
  .hands { transition: opacity 1.2s ease; }
  .scene--night .hands { opacity: 0; }
  .star { animation: twinkle 2.6s ease-in-out infinite; }
  .star:nth-child(3n) { animation-delay: 0.9s; }
  .star:nth-child(3n+1) { animation-delay: 1.7s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .fire-glow { animation: fireglow 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes fireglow { from { transform: scale(0.92); } to { transform: scale(1.08); } }

  /* Pause am Tag */
  .scene--pause .timo, .scene--pause .hands { opacity: 0; }
  .scene--pause .fly, .scene--pause .fly-dash, .scene--pause .calf-l,
  .scene--pause .calf-r, .scene--pause .cockpit { animation-play-state: paused; }
  .steam { animation: steam 2.6s ease-in-out infinite; }
  @keyframes steam {
    0% { transform: translateY(0); opacity: 0; }
    30% { opacity: 0.8; }
    100% { transform: translateY(-20px); opacity: 0; }
  }
  .pause-note {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; pointer-events: none; opacity: 0; transition: opacity 1s ease;
  }
  body.mode-pause .pause-note, body.mode-stale .pause-note { opacity: 1; }
  body.mode-pause .moment-stage, body.mode-stale .moment-stage { opacity: 0; transition: opacity 0.8s ease; }
  .pause-note__badge {
    width: 154px; height: 154px; border-radius: 50%;
    background: rgba(255, 253, 248, 0.9); backdrop-filter: blur(8px);
    box-shadow: 0 18px 44px rgba(29, 35, 38, 0.26);
    display: grid; place-items: center;
  }
  .pause-note p {
    font-size: 16.5px; font-weight: 700; color: #1f2a2f;
    background: rgba(255, 253, 248, 0.9); backdrop-filter: blur(8px);
    padding: 10px 20px; border-radius: 999px;
    box-shadow: 0 8px 22px rgba(29, 35, 38, 0.16);
  }

  /* Wetter */
  .rain, .snow, .extra-clouds, .fog { opacity: 0; transition: opacity 1.2s ease; }
  .scene--rain .rain { opacity: 1; }
  .scene--snow .snow { opacity: 1; }
  .scene--rain .sun-group, .scene--overcast .sun-group, .scene--snow .sun-group { opacity: 0.25; }
  .scene--rain .extra-clouds, .scene--overcast .extra-clouds, .scene--snow .extra-clouds { opacity: 1; }
  .scene--fog .fog { opacity: 0.85; }
  .raindrop { animation: rainfall 0.55s linear infinite; }
  @keyframes rainfall { to { transform: translate(-40px, 340px); } }
  .snowflake { animation: snowfall 4.5s linear infinite; }
  @keyframes snowfall { to { transform: translate(-30px, 380px); } }

  /* ── Momente ── */
  .moment-stage {
    position: absolute; left: 0; right: 0;
    top: calc(62px + env(safe-area-inset-top));
    display: flex; justify-content: center; pointer-events: none; z-index: 5;
  }
  .moment {
    position: absolute; width: min(56vw, 235px); opacity: 0;
    transform: translateY(18px) rotate(-2deg) scale(0.94);
    transition: opacity 0.8s ease, transform 0.9s cubic-bezier(0.18, 0.7, 0.3, 1.12);
  }
  .moment.show { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  .moment--photo {
    background: #fffdf8; border-radius: 6px; padding: 10px 10px 12px;
    box-shadow: 0 18px 42px rgba(29, 35, 38, 0.28);
    transform: translateY(18px) rotate(-4.5deg) scale(0.94);
  }
  .moment--photo.show { transform: translateY(0) rotate(-2.5deg) scale(1); }
  .moment--photo img {
    display: block; width: 100%; aspect-ratio: 4 / 3;
    object-fit: cover; border-radius: 3px; background: #e9e2d2;
  }
  .moment--photo .tape {
    position: absolute; top: -10px; left: 50%;
    width: 74px; height: 22px; transform: translateX(-50%) rotate(3deg);
    background: rgba(232, 217, 168, 0.85); border-radius: 2px;
  }
  .moment--card {
    background: rgba(255, 253, 248, 0.96); border-radius: 22px;
    padding: 16px 18px 15px; box-shadow: 0 18px 42px rgba(29, 35, 38, 0.24);
    text-align: center;
  }
  .moment__eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #8a5ca7; margin-bottom: 6px;
  }
  .moment__title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .moment__meta { font-size: 13.5px; color: #58656b; margin-top: 3px; font-weight: 600; }
  .moment__caption {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 9px; padding: 0 2px; font-size: 12.5px; font-weight: 700; color: #58656b;
  }
  .moment__flags { font-size: 42px; line-height: 1.15; margin: 4px 0 2px; }
  .moment__flags .arrow { font-size: 24px; color: #8a5ca7; vertical-align: middle; margin: 0 8px; }

  /* ── Minimap ── */
  .minimap {
    position: absolute; right: 12px; bottom: 14px; z-index: 6;
    width: 104px; height: 104px; padding: 0; cursor: pointer;
    background: rgba(255, 253, 248, 0.88);
    border: 1.5px solid rgba(31, 42, 47, 0.14); border-radius: 16px;
    box-shadow: 0 8px 22px rgba(29, 35, 38, 0.22); overflow: hidden;
  }
  #minimapMap { position: absolute; inset: 0; pointer-events: none; }
  #minimapMap .leaflet-control-container { display: none; }
  .minimap__hint {
    position: absolute; right: 5px; bottom: 3px; z-index: 800;
    font-size: 11px; color: #1f2a2f; pointer-events: none;
    background: rgba(255, 253, 248, 0.85); border-radius: 6px; padding: 0 3px;
  }
  .live-pos-marker { position: relative; width: 32px; height: 32px; }
  .live-pos-marker__dot {
    position: absolute; left: 10px; top: 10px; width: 12px; height: 12px;
    border-radius: 50%; background: #0c6b58; border: 2.5px solid #fff;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .live-pos-marker__pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(12, 107, 88, 0.35); animation: mappulse 2s ease-out infinite;
  }
  @keyframes mappulse { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  .scene-ctrl { position: absolute; left: 12px; bottom: 14px; z-index: 6; display: flex; gap: 6px; }
  .scene-ctrl a {
    width: 34px; height: 34px; display: grid; place-items: center;
    font-size: 14px; text-decoration: none; color: #1f2a2f;
    background: rgba(255, 253, 248, 0.82); backdrop-filter: blur(6px);
    border-radius: 50%; box-shadow: 0 2px 8px rgba(29, 35, 38, 0.14);
  }

  /* ── HUD ── */
  .hud-top {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 0 12px; pointer-events: none; z-index: 6;
  }
  .chip {
    font-size: 12.5px; font-weight: 700; color: #1f2a2f;
    background: rgba(255, 253, 248, 0.88); backdrop-filter: blur(8px);
    padding: 7px 12px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(29, 35, 38, 0.08);
  }
  .chip[hidden] { display: none; }
  .chip--live { color: #0c6b58; }
  .chip--live .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #0c6b58; margin-right: 5px; animation: pulse 2s ease-in-out infinite;
  }
  .chip--stale { color: #8a6d4a; }
  .chip--stale .dot { animation: none; background: #b9a487; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ── Fortschrittsleiste ── */
  .tour-progress {
    position: relative; flex: 0 0 auto; height: 16px; margin: 8px 12px 6px;
    border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(31, 42, 47, 0.1);
  }
  .tour-progress__track { position: absolute; inset: 0; }
  .tour-progress__veil { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(247, 241, 231, 0.72); }
  .tour-progress__marker { position: absolute; top: -1px; bottom: -1px; width: 3px; background: #fffdf8; box-shadow: 0 0 5px rgba(0, 0, 0, 0.35); }
  .tour-progress__label {
    position: absolute; top: 50%; transform: translate(8px, -50%);
    font-size: 9.5px; font-weight: 800; color: #1f2a2f;
    background: rgba(255, 253, 248, 0.92); padding: 1px 6px; border-radius: 7px; pointer-events: none;
  }

  /* ── Boxen ── */
  .boxes { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 0.9fr 1.1fr; gap: 7px; padding: 0 12px 8px; }
  .box {
    position: relative; background: rgba(255, 250, 244, 0.8); border-radius: 13px;
    padding: 7px 9px 6px; border: 1px solid rgba(31, 42, 47, 0.06);
    text-align: left; font: inherit; color: inherit;
  }
  button.box { cursor: pointer; }
  .box span { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #58656b; }
  .box strong { display: block; font-size: 14px; letter-spacing: -0.01em; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .box small { display: block; font-size: 9.5px; color: #58656b; margin-top: 1px; font-weight: 600; }
  .box__more { position: absolute; right: 7px; top: 7px; font-size: 11px; color: #8a938f; font-style: normal; }
  .health-tile { min-width: 0; overflow: hidden; }
  .health-tile__value {
    display: flex; align-items: baseline; gap: 3px; margin-top: 2px;
    color: #0c6b58; white-space: nowrap;
  }
  .health-tile__value strong { display: inline; font-size: 18px; line-height: 1; margin: 0; }
  .health-tile__value b { font-size: 9px; color: #58656b; }
  .health-tile__bar {
    display: flex; width: 100%; height: 4px; margin-top: 5px; overflow: hidden;
    border-radius: 2px; background: rgba(31, 42, 47, 0.08);
  }
  .health-tile__bar i { display: block; height: 100%; transition: width 0.35s ease; }
  .health-tile__bar-completed { background: #eb8f34; }
  .health-tile__bar-today { background: #0c6b58; }
  .health-tile__meta {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    margin-top: 4px; color: #58656b; font-size: 8.5px; font-weight: 700;
    white-space: nowrap;
  }
  .health-tile__meta span { display: inline; color: inherit; font-size: inherit; letter-spacing: 0; text-transform: none; }
  .health-tile__live { color: #0c6b58 !important; }
  .health-tile__live::before {
    content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 3px;
    border-radius: 50%; background: currentColor; vertical-align: 1px;
  }
  .poi-row { display: flex; justify-content: space-between; gap: 4px; font-size: 10px; font-weight: 600; color: #3d4a50; margin-top: 2px; }
  .poi-row b { font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .poi-row em { font-style: normal; color: #58656b; flex-shrink: 0; }
  .thumb-stack { position: relative; height: 40px; margin-top: 3px; }
  .thumb-stack img {
    position: absolute; width: 44px; height: 38px; object-fit: cover;
    border-radius: 6px; border: 2px solid #fffdf8;
    box-shadow: 0 2px 6px rgba(29, 35, 38, 0.18); background: #e9e2d2;
  }
  .thumb-stack img:nth-child(1) { left: 0; transform: rotate(-5deg); }
  .thumb-stack img:nth-child(2) { left: 26px; transform: rotate(3deg); top: 1px; }
  .thumb-stack img:nth-child(3) { left: 52px; transform: rotate(-2deg); }
  .thumb-stack__count {
    position: absolute; right: 0; bottom: 0; font-size: 9px; font-weight: 800;
    color: #fffdf8; background: #0c6b58; border-radius: 8px; padding: 1.5px 6px;
  }

  /* ── Popups ── */
  .sheet {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center;
    background: rgba(18, 32, 50, 0.55); backdrop-filter: blur(3px); padding: 18px;
  }
  .sheet.open { display: flex; }
  .sheet__card {
    position: relative; width: min(94vw, 560px); max-height: 78vh; overflow-y: auto;
    background: #fffdf8; border-radius: 22px; padding: 18px 16px 16px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
  }
  .sheet__title { font-size: 17px; letter-spacing: -0.02em; margin-bottom: 2px; }
  .sheet__sub { font-size: 12px; color: #58656b; font-weight: 600; margin-bottom: 12px; }
  .sheet__close {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px;
    border: none; border-radius: 50%; background: rgba(31, 42, 47, 0.06);
    color: #1f2a2f; font-size: 15px; cursor: pointer; z-index: 2;
  }
  .album-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .album-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #e9e2d2; cursor: pointer; }
  .health-sheet__card { width: min(94vw, 600px); max-height: min(88vh, 780px); padding: 20px 18px 18px; }
  .health-hero {
    display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(150px, 0.8fr); gap: 16px;
    align-items: stretch; margin-bottom: 12px; padding: 16px;
    border: 1px solid rgba(12, 107, 88, 0.15); border-radius: 8px;
    background: linear-gradient(135deg, rgba(12, 107, 88, 0.1), rgba(255, 253, 248, 0.35));
  }
  .health-hero__eyebrow {
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: #0c6b58;
  }
  .health-hero__total { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .health-hero__total strong {
    font-size: 38px; line-height: 1; color: #1f2a2f; font-variant-numeric: tabular-nums;
  }
  .health-hero__total span { font-size: 14px; font-weight: 800; color: #58656b; }
  .health-hero__caption { margin-top: 5px; font-size: 11px; line-height: 1.3; color: #58656b; font-weight: 650; }
  .health-source { align-self: center; }
  .health-source__bar {
    display: flex; height: 9px; overflow: hidden; border-radius: 5px;
    background: rgba(31, 42, 47, 0.08);
  }
  .health-source__bar span { display: block; height: 100%; min-width: 0; transition: width 0.35s ease; }
  .health-source__completed { background: #eb8f34; }
  .health-source__today { background: #0c6b58; }
  .health-source__labels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .health-source__labels div { min-width: 0; }
  .health-source__labels span { display: block; font-size: 9px; color: #718087; font-weight: 750; }
  .health-source__labels b { display: block; margin-top: 1px; font-size: 12px; color: #3d4a50; font-variant-numeric: tabular-nums; }
  .health-source__labels div:last-child { text-align: right; }
  .health-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .health-metric {
    min-width: 0; min-height: 84px; padding: 10px;
    border: 1px solid rgba(31, 42, 47, 0.08); border-top: 3px solid var(--metric-color);
    border-radius: 7px; background: rgba(255, 255, 255, 0.48);
  }
  .health-metric__icon {
    display: grid; place-items: center; width: 22px; height: 22px; margin-bottom: 7px;
    border-radius: 50%; color: var(--metric-color); background: color-mix(in srgb, var(--metric-color) 12%, transparent);
    font-size: 11px; font-weight: 900;
  }
  .health-metric span { display: block; font-size: 9px; color: #718087; font-weight: 750; }
  .health-metric strong {
    display: block; margin-top: 2px; overflow-wrap: anywhere; font-size: 15px; line-height: 1.1;
    color: #1f2a2f; font-variant-numeric: tabular-nums;
  }
  .health-metric small { display: block; margin-top: 3px; font-size: 8.5px; color: #718087; font-weight: 650; }
  .health-section { margin-top: 16px; }
  .health-section__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .health-section__head h4 { font-size: 12px; color: #1f2a2f; }
  .health-section__head span { font-size: 10px; color: #718087; font-weight: 700; }
  .stage-list { position: relative; padding-left: 17px; }
  .stage-list::before {
    content: ""; position: absolute; left: 4px; top: 13px; bottom: 13px; width: 2px;
    background: rgba(12, 107, 88, 0.16);
  }
  .stage-item { position: relative; padding: 9px 0 10px 8px; border-bottom: 1px solid rgba(31, 42, 47, 0.07); }
  .stage-item::before {
    content: ""; position: absolute; left: -17px; top: 14px; width: 8px; height: 8px;
    border: 2px solid #fffdf8; border-radius: 50%; background: #0c6b58; box-shadow: 0 0 0 1px rgba(12, 107, 88, 0.28);
  }
  .stage-item__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .stage-item__date { font-size: 12px; color: #3d4a50; font-weight: 800; }
  .stage-item__distance { font-size: 15px; color: #1f2a2f; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stage-item__metrics { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; }
  .stage-item__metrics span { font-size: 10px; color: #718087; font-weight: 700; white-space: nowrap; }
  .activity-list { border-top: 1px solid rgba(31, 42, 47, 0.07); }
  .activity-item { border-bottom: 1px solid rgba(31, 42, 47, 0.07); }
  .activity-item summary {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 10px 2px; cursor: pointer; list-style: none;
  }
  .activity-item summary::-webkit-details-marker { display: none; }
  .activity-item summary::after { content: "+"; grid-column: 3; color: #718087; font-size: 16px; }
  .activity-item[open] summary::after { content: "−"; }
  .activity-item__name { min-width: 0; }
  .activity-item__name b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: #3d4a50; }
  .activity-item__name small { display: block; margin-top: 2px; font-size: 9.5px; color: #718087; font-weight: 650; }
  .activity-item__distance { font-size: 13px; color: #0c6b58; font-weight: 800; font-variant-numeric: tabular-nums; }
  .activity-item__details {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px;
    padding: 0 2px 11px;
  }
  .activity-item__details span { font-size: 9px; color: #718087; font-weight: 700; }
  .activity-item__details b { display: block; margin-top: 1px; font-size: 11px; color: #3d4a50; font-variant-numeric: tabular-nums; }
  .setup-hint {
    background: rgba(235, 143, 52, 0.1); border: 1px solid rgba(235, 143, 52, 0.3);
    border-radius: 8px; padding: 12px 14px; font-size: 12.5px; color: #7a5a2f; font-weight: 600;
  }
  @media (max-width: 420px) {
    .health-tile__meta { gap: 2px; font-size: 8px; }
    .health-sheet__card { padding: 18px 14px 14px; }
    .health-hero { grid-template-columns: 1fr; gap: 12px; padding: 13px; }
    .health-hero__total strong { font-size: 34px; }
    .health-metrics { grid-template-columns: repeat(2, 1fr); }
    .health-metric { min-height: 78px; }
  }
  #bigmap { width: 100%; height: min(64vh, 560px); border-radius: 14px; }
  .map-modal__card { padding: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>

<script type="module">
  import { loadRouteData } from "./src/services/gpxRouteService.js";
  import { createLocationProvider } from "./src/location/LocationProvider.js";
  import { mapLocationToRoute, computeMovementStatus } from "./src/services/routePositionService.js";
  import { buildCountrySegments, COUNTRY_NAMES } from "./src/services/routeCountryService.js";
  import { reverseGeocode, geocodeOnce } from "./src/services/geocodeService.js";
  import { loadPoiData } from "./src/services/poiService.js";
  import { startPhotoService } from "./src/services/photoService.js";
  import { fetchWeather } from "./src/services/weatherService.js";
  import { startTourStatsService } from "./src/services/tourStatsService.js";
  import { createJourneyTimelineCard } from "./src/components/journeyTimeline.js";
  import { getCountryPreset } from "./src/config/scenePresets.js";
  import { tripMeta } from "./src/data/mockData.js";

  const PHOTO_HOST = "https://zweiaufachse.thefinks.de";
  const STALE_MS = 2 * 60 * 60 * 1000;   // Fix aelter → "Signal veraltet"
  const PAUSE_MS = 10 * 60 * 1000;       // so lange still → Pause
  const MOVEMENT_THRESHOLD_KPH = 4;       // darunter ist es Pause/Stand statt Fahrt
  const NIGHT_FROM = 21;
  const NIGHT_TO = 7;

  const state = {
    routeData: null,
    locationData: null,
    previousLocationData: null,
    lastMovementAt: null,
    geocodeData: null,
    countrySegments: [],
    poiData: null,
    photos: [],
    weather: null,
    stats: { todayKm: null, yesterdayKm: null, strava: { configured: false } },
    mode: "unknown",
  };

  const $ = (id) => document.getElementById(id);
  const fmtKm = (km) => (km == null ? "–" : `${Math.round(km).toLocaleString("de-DE")} km`);

  // Tage bis zur Abfahrt (negativ/0 = die Reise laeuft)
  function daysUntilStart() {
    if (!tripMeta.startDate) return null;
    const start = new Date(`${tripMeta.startDate}T00:00:00`);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((start - today) / 86_400_000);
  }

  function startDateLabel() {
    return new Date(`${tripMeta.startDate}T00:00:00`)
      .toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  }

  // ── Landes-Presets auf die Szene anwenden ──
  let appliedCountry = null;

  function villageSvg(type) {
    const roofs = {
      gable: "#b5533c", chalet: "#8a5b3c", campanile: "#c0663f",
      stone: "#a05a3c", minaret: "#b5533c", whitehouse: "#2c6fad",
    };
    const roof = roofs[type] ?? "#b5533c";
    const base = `
      <rect x="0" y="-10" width="14" height="10" fill="#e9e2d2"/>
      <path d="M-1.5 -10 L7 -17 L15.5 -10 Z" fill="${roof}"/>
      <rect x="18" y="-8" width="11" height="8" fill="#efe8d8"/>
      <path d="M16.5 -8 L23.5 -14 L30.5 -8 Z" fill="${roof}"/>`;

    if (type === "minaret") {
      return base + `
        <rect x="34" y="-24" width="3.5" height="24" fill="#f4efe2"/>
        <path d="M35.75 -31 L33 -24 L38.5 -24 Z" fill="#4d7a63"/>`;
    }
    if (type === "campanile") {
      return base + `
        <rect x="34" y="-26" width="6" height="26" fill="#e5ddc9"/>
        <path d="M37 -33 L33 -26 L41 -26 Z" fill="${roof}"/>`;
    }
    if (type === "chalet") {
      return base + `
        <rect x="33" y="-9" width="13" height="9" fill="#c9a877"/>
        <path d="M31 -9 L39.5 -17 L48 -9 Z" fill="#6b4a30"/>`;
    }
    if (type === "whitehouse") {
      return `
        <rect x="0" y="-10" width="14" height="10" fill="#fffdf8"/>
        <path d="M-1 -10 L7 -15 L15 -10 Z" fill="#2c6fad"/>
        <rect x="18" y="-8" width="12" height="8" fill="#fffdf8"/>
        <path d="M17 -8 L24 -13 L31 -8 Z" fill="#2c6fad"/>
        <rect x="34" y="-11" width="10" height="11" fill="#fffdf8"/>
        <path d="M33 -11 L39 -16 L45 -11 Z" fill="#2c6fad"/>`;
    }
    return base + `<rect x="33" y="-7" width="10" height="7" fill="#ded5c0"/>`;
  }

  function applyCountry(code) {
    if (!code || code === appliedCountry) return;
    appliedCountry = code;
    const preset = getCountryPreset(code);

    $("jersey").innerHTML =
      `<rect x="350" y="726" width="100" height="136" fill="${preset.jersey.base}"/>` +
      preset.jersey.overlay;
    $("sleeveL").setAttribute("stroke", preset.jersey.base);
    $("sleeveR").setAttribute("stroke", preset.jersey.base);

    $("hillFar").setAttribute("fill", preset.hillFar);
    $("hillNear").setAttribute("fill", preset.hillNear);
    $("fieldBand").setAttribute("fill", preset.field);
    $("snowCaps").setAttribute("opacity", preset.snowCaps ? "1" : "0");
    $("seaBand").setAttribute("opacity", preset.sea ? "1" : "0");
    $("villageSlot").innerHTML = villageSvg(preset.village);

    document.querySelectorAll(".road-tree").forEach((el) => {
      el.setAttribute("href", `#tree-${preset.tree}`);
    });
  }

  // ── Zustand aus den Live-Daten ableiten ──
  function riderLocalHour() {
    if (state.weather?.localTime) {
      const hour = Number(state.weather.localTime.slice(11, 13));
      if (Number.isFinite(hour)) return hour;
    }
    return new Date().getHours();
  }

  function computeMode() {
    if (!state.locationData) return "unknown";

    const fixTime = new Date(state.locationData.timestamp).getTime();
    const ageMs = Number.isNaN(fixTime) ? null : Date.now() - fixTime;
    const hour = riderLocalHour();
    const isNight = hour >= NIGHT_FROM || hour < NIGHT_TO;

    if (ageMs != null && ageMs > STALE_MS) return isNight ? "night" : "stale";

    if (Number.isFinite(state.locationData.speedKph)) {
      return state.locationData.speedKph >= MOVEMENT_THRESHOLD_KPH
        ? "day"
        : isNight ? "night" : "pause";
    }

    if (state.locationData.motion === false) return isNight ? "night" : "pause";
    if (state.locationData.motion === true) return "day";

    const { isMoving } = computeMovementStatus(state.locationData, state.previousLocationData);
    if (isMoving) return "day";

    if (isMoving === false) {
      if (isNight) return "night";
      // Ohne je gesehene Bewegung stehen sie wirklich — sonst kann es ein
      // kurzer Halt an der Ampel sein, dann laeuft die Szene weiter.
      const stillMs = state.lastMovementAt ? Date.now() - state.lastMovementAt : Infinity;
      return stillMs >= PAUSE_MS ? "pause" : "day";
    }

    // isMoving === null: erst ein Fix, Bewegung noch nicht bestimmbar
    return isNight ? "night" : "day";
  }

  function applyMode(mode) {
    state.mode = mode;
    const scene = $("scene");
    scene.classList.toggle("scene--night", mode === "night");
    scene.classList.toggle("scene--pause", mode === "pause" || mode === "stale");
    document.body.classList.toggle("mode-pause", mode === "pause");
    document.body.classList.toggle("mode-stale", mode === "stale");

    // Vor der Abfahrt hat der Ruhe-Zustand eine eigene Botschaft
    const until = daysUntilStart();
    $("pauseText").textContent =
      until != null && until > 0
        ? `Die Reise beginnt am ${startDateLabel()}`
        : mode === "stale"
          ? "Gerade kein GPS-Signal"
          : "Gerade wird Pause gemacht";

    const chip = $("chipState");
    chip.classList.toggle("chip--stale", mode === "stale");

    // Vor der Abfahrt ist "Pause" irrefuehrend — sie sind schlicht startklar
    if (until != null && until > 0 && mode !== "day") {
      $("chipStateText").textContent = "startklar";
      return;
    }

    $("chipStateText").textContent =
      mode === "day" ? "in Bewegung"
      : mode === "pause" ? "Pause ☕"
      : mode === "night" ? "schläft 🌙"
      : mode === "stale" ? "Signal veraltet"
      : "Verbinde…";
  }

  function formatAge(ms) {
    if (ms < 90_000) return "gerade eben";
    const minutes = Math.round(ms / 60_000);
    if (minutes < 60) return `vor ${minutes} Min`;
    const hours = Math.round(ms / 3_600_000);
    if (hours < 48) return `vor ${hours} Std`;
    return `vor ${Math.round(hours / 24)} Tagen`;
  }

  // ── Rendering ──
  function renderScene() {
    const loc = state.locationData;
    const match = loc?.routeMatch;

    // Solange Traccar nicht eingerichtet ist, laeuft der Mock — das sagen wir
    // offen, statt die Startposition als Live-Signal auszugeben.
    $("chipNoGps").hidden = loc?.providerType !== "mock";

    // Tempo: Traccar liefert speedKph, sonst aus zwei Fixes berechnet
    const movement = computeMovementStatus(loc, state.previousLocationData);
    const speed = loc?.speedKph ?? movement.speedKph;
    const showSpeed = speed != null;
    $("dispSpeed").textContent = showSpeed ? String(Math.round(speed)) : "--";

    // Animationstempo folgt der echten Geschwindigkeit
    if (state.mode === "day" && showSpeed && speed > 1) {
      const factor = Math.min(2.2, Math.max(0.5, 19 / speed));
      $("scene").style.setProperty("--wheel", `${(0.82 * factor).toFixed(2)}s`);
      $("scene").style.setProperty("--pedal", `${(0.42 * factor).toFixed(2)}s`);
    }

    $("dispToday").textContent =
      state.stats.todayKm != null ? `heute ${Math.round(state.stats.todayKm)} km` : "heute –";

    if (match) {
      const pct = Math.round(match.progressRatio * 100);
      $("dispPct").textContent = `${pct} %`;
      $("dispBar").setAttribute("width", String((160 * match.progressRatio).toFixed(1)));
      $("signKm").textContent = Math.round(match.distanceDoneKm).toLocaleString("de-DE");

      $("tpVeil").style.width = `${(100 - pct).toFixed(1)}%`;
      $("tpMarker").style.left = `calc(${pct}% - 1.5px)`;
      $("tpLabel").style.left = `${pct}%`;
      $("tpLabel").textContent = `${pct} %`;
    }

    if (state.geocodeData?.locationLabel) {
      $("signPlace").textContent = state.geocodeData.locationLabel;
      const chipPlace = $("chipPlace");
      chipPlace.hidden = false;
      chipPlace.textContent = `${state.geocodeData.flag ?? ""} ${state.geocodeData.locationLabel}`.trim();
    }

    if (state.weather) {
      const chipWeather = $("chipWeather");
      chipWeather.hidden = false;
      const preset = state.weather.preset;
      const icon = state.mode === "night" ? preset.nightIcon : preset.icon;
      const temp = state.weather.temperatureC != null ? `${Math.round(state.weather.temperatureC)}°C` : "";
      chipWeather.textContent = `${icon} ${temp}`.trim();

      $("scene").classList.remove("scene--rain", "scene--snow", "scene--overcast", "scene--fog", "scene--thunder");
      if (preset.sceneClass) {
        preset.sceneClass.split(" ").forEach((cls) => $("scene").classList.add(cls));
      }
    }

    if (loc?.timestamp) {
      const ageMs = Date.now() - new Date(loc.timestamp).getTime();
      const chipFresh = $("chipFresh");
      chipFresh.hidden = false;
      chipFresh.textContent = formatAge(Math.max(0, ageMs));
    }
  }

  function currentCountryIndex() {
    const ratio = state.locationData?.routeMatch?.progressRatio;
    if (ratio == null || !state.countrySegments.length) return -1;
    for (let i = 0; i < state.countrySegments.length; i++) {
      if (ratio < state.countrySegments[i].toPercent) return i;
    }
    return state.countrySegments.length - 1;
  }

  function renderBorder() {
    const idx = currentCountryIndex();
    const card = document.querySelector('[data-moment="border"]');
    if (idx < 0 || idx >= state.countrySegments.length - 1 || !state.routeData) {
      card.hidden = true;
      return;
    }

    const current = state.countrySegments[idx];
    const next = state.countrySegments[idx + 1];
    const totalKm = state.routeData.totalDistanceKm;
    const doneKm = state.locationData.routeMatch.distanceDoneKm;
    const kmAhead = current.toPercent * totalKm - doneKm;
    if (kmAhead <= 0) {
      card.hidden = true;
      return;
    }

    card.hidden = false;
    $("borderFlags").innerHTML = `${current.flag}<span class="arrow">→</span>${next.flag}`;
    $("borderName").textContent = COUNTRY_NAMES[next.code] ?? next.code;
    $("borderMeta").textContent =
      `in ${Math.round(kmAhead)} km · Land ${idx + 2} von ${state.countrySegments.length}`;
    $("dispBorder").textContent = `${next.flag} Grenze in ${Math.round(kmAhead)} km`;
  }

  function renderPois() {
    const doneKm = state.locationData?.routeMatch?.distanceDoneKm;
    if (doneKm == null || !state.poiData?.pois?.length) return;

    const next = state.poiData.pois
      .filter((poi) =>
        !poi.needsEnrichment &&
        poi.score >= 0.6 &&
        poi.routeKm != null &&
        poi.routeKm > doneKm &&
        (poi.distanceFromRouteKm == null || poi.distanceFromRouteKm <= 5))
      .sort((a, b) => a.routeKm - b.routeKm)
      .slice(0, 3);

    $("poiList").innerHTML = next.length
      ? next.map((poi) => `
          <div class="poi-row">
            <b>${poi.name}</b><em>${Math.round(poi.routeKm - doneKm)} km</em>
          </div>`).join("")
      : `<div class="poi-row"><b>keine in Reichweite</b></div>`;
  }

  function renderProgressTrack() {
    if (!state.countrySegments.length) return;
    const stops = state.countrySegments
      .map((seg) => `${seg.color} ${(seg.fromPercent * 100).toFixed(2)}% ${(seg.toPercent * 100).toFixed(2)}%`)
      .join(", ");
    $("tpTrack").style.background = `linear-gradient(90deg, ${stops})`;
  }

  function renderTimeline() {
    if (!state.routeData || !state.countrySegments.length) return;
    $("jtSlot").innerHTML = createJourneyTimelineCard(
      state.routeData,
      state.locationData,
      state.countrySegments,
      { todayKm: state.stats.todayKm, yesterdayKm: state.stats.yesterdayKm },
    );
  }

  function renderStatsSurfaces() {
    try {
      renderScene();
      renderTimeline();
      renderStrava();
    } catch (error) {
      console.error("[StatsRender]", error);
    }
  }

  // ── Strava-Box + Popup ──
  function fmtHm(meters) {
    return meters == null ? "–" : `${Math.round(meters).toLocaleString("de-DE")} hm`;
  }

  function fmtHours(seconds) {
    if (!seconds) return "–";
    const totalMinutes = Math.round(seconds / 60);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    return hours > 0 ? `${hours}:${String(minutes).padStart(2, "0")} h` : `${minutes} min`;
  }

  function fmtCalories(calories) {
    return calories ? `${Math.round(calories).toLocaleString("de-DE")} kcal` : "–";
  }

  function fmtPulse(value) {
    return value ? `${Math.round(value)} bpm` : "–";
  }

  function fmtDistanceNumber(km) {
    return Math.round(km ?? 0).toLocaleString("de-DE");
  }

  function fmtDateShort(dateKey) {
    return new Date(`${dateKey}T12:00:00`)
      .toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function sumTripDays(entries) {
    return entries.reduce((acc, [, day]) => {
      acc.distanceKm += day.distanceKm ?? 0;
      acc.elevationM += day.elevationM ?? 0;
      acc.calories += day.calories ?? 0;
      acc.movingTime += day.movingTime ?? 0;
      acc.elapsedTime += day.elapsedTime ?? 0;
      acc.rides += day.rides ?? 0;
      if (day.avgHeartrate != null) {
        const weight = Math.max(1, day.movingTime ?? 1);
        acc.hrSum += day.avgHeartrate * weight;
        acc.hrWeight += weight;
      }
      if (day.maxHeartrate != null) acc.maxHeartrate = Math.max(acc.maxHeartrate ?? 0, day.maxHeartrate);
      return acc;
    }, {
      distanceKm: 0,
      elevationM: 0,
      calories: 0,
      movingTime: 0,
      elapsedTime: 0,
      rides: 0,
      hrSum: 0,
      hrWeight: 0,
      maxHeartrate: null,
    });
  }

  function renderStrava() {
    const strava = state.stats.strava ?? {};

    if (!strava.configured) {
      $("healthLabel").textContent = "Strava";
      $("healthValue").textContent = "–";
      $("healthSub").textContent = "noch nicht verbunden";
      $("healthToday").textContent = "offline";
      $("healthToday").classList.remove("health-tile__live");
      $("healthBarCompleted").style.width = "0";
      $("healthBarToday").style.width = "0";
      $("healthSheetSub").textContent = "Strava ist noch nicht eingerichtet";
      $("healthContent").innerHTML = `
        <div class="setup-hint">
          Sobald Strava verbunden ist, erscheinen hier die abgeschlossenen Etappen:
          Distanz, Höhenmeter, Fahrzeit, Kalorien und Puls. Der aktuelle Tag bleibt
          live aus Traccar.<br><br>
          ${strava.reason ? `<strong>${escapeHtml(strava.reason)}</strong><br><br>` : ""}
          Benötigte Secrets: <strong>STRAVA_CLIENT_ID</strong>,
          <strong>STRAVA_CLIENT_SECRET</strong>, <strong>STRAVA_REFRESH_TOKEN</strong>.
        </div>`;
      return;
    }

    const today = todayKeyForRiders();
    const tripEntries = Object.entries(strava.tripDays ?? {}).sort(([a], [b]) => b.localeCompare(a));
    const completedEntries = tripEntries.filter(([day]) => day < today);
    const completed = sumTripDays(completedEntries);
    const todayKm = state.stats.sources?.today === "traccar" ? state.stats.todayKm : null;
    const totalKm = completed.distanceKm + (todayKm ?? 0);
    const avgHr = completed.hrWeight > 0 ? Math.round(completed.hrSum / completed.hrWeight) : null;
    const completedShare = totalKm > 0 ? completed.distanceKm / totalKm * 100 : 0;
    const todayShare = totalKm > 0 ? (todayKm ?? 0) / totalKm * 100 : 0;

    $("healthLabel").textContent = "Tour bisher";
    $("healthValue").textContent = fmtDistanceNumber(totalKm);
    $("healthSub").textContent = `${completedEntries.length} ${completedEntries.length === 1 ? "Etappe" : "Etappen"}`;
    $("healthToday").textContent = todayKm != null ? `heute ${fmtDistanceNumber(todayKm)}` : "heute live";
    $("healthToday").classList.add("health-tile__live");
    $("healthBarCompleted").style.width = `${completedShare}%`;
    $("healthBarToday").style.width = `${todayShare}%`;
    $("healthSheetSub").textContent = `Heute live mit Traccar · abgeschlossene Tage aus Strava`;

    const tours = (strava.tripTours ?? [])
      .filter((tour) => tour.date < today)
      .slice(0, 12);

    $("healthContent").innerHTML = `
      <div class="health-hero">
        <div>
          <span class="health-hero__eyebrow">Tour bisher</span>
          <div class="health-hero__total"><strong>${fmtDistanceNumber(totalKm)}</strong><span>km</span></div>
          <p class="health-hero__caption">${completedEntries.length} abgeschlossene ${completedEntries.length === 1 ? "Etappe" : "Etappen"} · ${completed.rides} ${completed.rides === 1 ? "Aktivität" : "Aktivitäten"}</p>
        </div>
        <div class="health-source">
          <div class="health-source__bar" aria-label="Distanzanteile aus Strava und Traccar">
            <span class="health-source__completed" style="width:${completedShare}%"></span>
            <span class="health-source__today" style="width:${todayShare}%"></span>
          </div>
          <div class="health-source__labels">
            <div><span>Strava · fertig</span><b>${fmtKm(completed.distanceKm)}</b></div>
            <div><span>Traccar · heute</span><b>${todayKm != null ? fmtKm(todayKm) : "live"}</b></div>
          </div>
        </div>
      </div>
      <div class="health-metrics" aria-label="Werte abgeschlossener Etappen">
        <div class="health-metric" style="--metric-color:#eb8f34">
          <i class="health-metric__icon">↗</i><span>Höhenmeter</span><strong>${fmtHm(completed.elevationM)}</strong><small>Strava gesamt</small>
        </div>
        <div class="health-metric" style="--metric-color:#397a9b">
          <i class="health-metric__icon">h</i><span>Fahrzeit</span><strong>${fmtHours(completed.movingTime)}</strong><small>${completed.elapsedTime ? `${fmtHours(completed.elapsedTime)} verstrichen` : "in Bewegung"}</small>
        </div>
        <div class="health-metric" style="--metric-color:#b8732f">
          <i class="health-metric__icon">k</i><span>Energie</span><strong>${fmtCalories(completed.calories)}</strong><small>Kalorien</small>
        </div>
        <div class="health-metric" style="--metric-color:#bd4e5b">
          <i class="health-metric__icon">♥</i><span>Ø Puls</span><strong>${fmtPulse(avgHr)}</strong><small>max. ${fmtPulse(completed.maxHeartrate)}</small>
        </div>
      </div>
      ${completedEntries.length ? `
        <section class="health-section">
          <div class="health-section__head"><h4>Etappen</h4><span>neueste zuerst</span></div>
          <div class="stage-list">
            ${completedEntries.map(([day, values]) => `
              <article class="stage-item">
                <div class="stage-item__head">
                  <span class="stage-item__date">${fmtDateShort(day)}</span>
                  <strong class="stage-item__distance">${fmtKm(values.distanceKm)}</strong>
                </div>
                <div class="stage-item__metrics">
                  <span>↗ ${fmtHm(values.elevationM)}</span>
                  <span>Fahrt ${fmtHours(values.movingTime)}</span>
                  <span>Gesamt ${fmtHours(values.elapsedTime)}</span>
                  <span>${fmtCalories(values.calories)}</span>
                  <span>Ø ${fmtPulse(values.avgHeartrate)}</span>
                  <span>max. ${fmtPulse(values.maxHeartrate)}</span>
                  <span>${values.rides ?? 0} ${values.rides === 1 ? "Aktivität" : "Aktivitäten"}</span>
                </div>
              </article>`).join("")}
          </div>
        </section>` : `
        <div class="setup-hint">Noch keine abgeschlossene Strava-Etappe seit Tourstart. Der erste abgeschlossene Tourtag erscheint hier automatisch.</div>`}
      ${tours.length ? `
        <section class="health-section">
          <div class="health-section__head"><h4>Aktivitäten</h4><span>${tours.length} Einträge</span></div>
          <div class="activity-list">
            ${tours.map((tour) => `
              <details class="activity-item">
                <summary>
                  <span class="activity-item__name"><b>${escapeHtml(tour.name)}</b><small>${fmtDateShort(tour.date)}</small></span>
                  <strong class="activity-item__distance">${fmtKm(tour.distanceKm)}</strong>
                </summary>
                <div class="activity-item__details">
                  <span>Höhenmeter<b>${fmtHm(tour.elevationM)}</b></span>
                  <span>Fahrzeit<b>${fmtHours(tour.movingTime)}</b></span>
                  <span>Gesamtzeit<b>${fmtHours(tour.elapsedTime)}</b></span>
                  <span>Kalorien<b>${fmtCalories(tour.calories)}</b></span>
                  <span>Ø Puls<b>${fmtPulse(tour.avgHeartrate)}</b></span>
                  <span>Max. Puls<b>${fmtPulse(tour.maxHeartrate)}</b></span>
                </div>
              </details>`).join("")}
          </div>
        </section>` : ""}
    `;
  }

  // ── Fotos: Box, Album, Slider (nur heutige) ──
  const stage = $("momentStage");
  let photoCards = [];
  let carouselStarted = false;

  function todayKeyForRiders() {
    if (state.weather?.localTime) return state.weather.localTime.slice(0, 10);
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  }

  function renderPhotos() {
    const photos = state.photos.filter((photo) => photo.thumbUrl);

    $("thumbStack").innerHTML =
      photos.slice(0, 3).map((photo) => `<img src="${PHOTO_HOST}${photo.thumbUrl}" alt="" loading="lazy" />`).join("") +
      (photos.length ? `<span class="thumb-stack__count">${photos.length}</span>` : "");

    $("albumGrid").innerHTML = photos
      .map((photo, index) => `<img src="${PHOTO_HOST}${photo.thumbUrl}" data-idx="${index}" alt="Foto von unterwegs" loading="lazy" />`)
      .join("");
    $("albumCount").textContent = photos.length
      ? `${photos.length} Fotos von unterwegs`
      : "Noch keine Fotos";

    // Slider: nur Fotos des heutigen Kalendertages
    const today = todayKeyForRiders();
    const todays = photos.filter((photo) => photo.date?.slice(0, 10) === today).slice(0, 5);

    photoCards.forEach((card) => card.remove());
    photoCards = todays.map((photo) => {
      const card = document.createElement("div");
      card.className = "moment moment--photo";
      const ageH = Math.max(1, Math.round((Date.now() - new Date(photo.date).getTime()) / 3_600_000));
      card.innerHTML = `
        <span class="tape"></span>
        <img src="${PHOTO_HOST}${photo.thumbUrl}" alt="Foto von heute" />
        <div class="moment__caption"><span>📍 <span data-loc>…</span></span><span>vor ${ageH} Std</span></div>`;
      card.querySelector("img").addEventListener("error", () => { card.dataset.dead = "1"; });
      stage.appendChild(card);

      if (photo.lat != null) {
        geocodeOnce(photo.lat, photo.lon)
          .then((geo) => {
            const el = card.querySelector("[data-loc]");
            if (el) el.textContent = geo?.locationLabel ?? "unterwegs";
          })
          .catch(() => {
            const el = card.querySelector("[data-loc]");
            if (el) el.textContent = "unterwegs";
          });
      } else {
        card.querySelector("[data-loc]").textContent = "unterwegs";
      }
      return card;
    });

    if (!carouselStarted) {
      carouselStarted = true;
      startCarousel();
    }
  }

  function startCarousel() {
    const SHOW_MS = 6000;
    const GAP_MS = 900;
    let idx = 0;

    function next() {
      const border = document.querySelector('[data-moment="border"]');
      const cards = [...photoCards.filter((c) => c.dataset.dead !== "1")];
      if (border && !border.hidden) cards.push(border);

      if (!cards.length) {
        setTimeout(next, 4000);
        return;
      }

      const card = cards[idx % cards.length];
      idx += 1;
      card.classList.add("show");
      setTimeout(() => card.classList.remove("show"), SHOW_MS);
      setTimeout(next, SHOW_MS + GAP_MS);
    }
    setTimeout(next, 1500);
  }

  // ── Lightbox ──
  const lightbox = $("photo-lightbox");
  let lbIdx = 0;

  function albumPhotos() {
    return state.photos.filter((photo) => photo.thumbUrl);
  }

  function showLightbox(dir = 0) {
    const photos = albumPhotos();
    const photo = photos[lbIdx];
    if (!photo) return;

    const img = lightbox.querySelector(".photo-lightbox__img");
    img.src = PHOTO_HOST + (photo.lightboxUrl ?? photo.thumbUrl);
    if (dir !== 0 && typeof img.animate === "function") {
      img.animate(
        [{ opacity: 0.25, transform: `translateX(${dir * 28}px)` }, { opacity: 1, transform: "none" }],
        { duration: 200, easing: "ease-out" },
      );
    }

    const date = photo.date ? new Date(photo.date) : null;
    lightbox.querySelector(".photo-lightbox__caption").innerHTML = `<div class="lc-chips">
      <span class="lc-chip">${lbIdx + 1}/${photos.length}</span>
      ${date ? `<span class="lc-chip">${date.toLocaleDateString("de-DE", { day: "2-digit", month: "long" })}</span>` : ""}
      ${date ? `<span class="lc-chip">${date.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr</span>` : ""}
      ${photo.lat != null ? `<span class="lc-chip">📍 <span id="lbLoc">…</span></span>` : ""}
    </div>`;

    if (photo.lat != null) {
      const captured = lbIdx;
      geocodeOnce(photo.lat, photo.lon)
        .then((geo) => {
          if (captured !== lbIdx) return;
          const el = $("lbLoc");
          if (el) el.textContent = geo?.locationLabel ?? "unterwegs";
        })
        .catch(() => {});
    }

    for (const n of [lbIdx - 1, lbIdx + 1]) {
      const neighbor = photos[n];
      if (neighbor) new Image().src = PHOTO_HOST + (neighbor.lightboxUrl ?? neighbor.thumbUrl);
    }
  }

  function navLightbox(dir) {
    const next = lbIdx + dir;
    if (next < 0 || next >= albumPhotos().length) return;
    lbIdx = next;
    showLightbox(dir);
  }

  $("albumGrid").addEventListener("click", (event) => {
    const img = event.target.closest("img[data-idx]");
    if (!img) return;
    lbIdx = Number(img.dataset.idx);
    showLightbox();
    lightbox.showModal();
  });
  lightbox.querySelector("[data-lightbox-close]").addEventListener("click", () => lightbox.close());
  lightbox.addEventListener("click", (event) => { if (event.target === lightbox) lightbox.close(); });
  document.addEventListener("keydown", (event) => {
    if (!lightbox.open) return;
    if (event.key === "ArrowRight") navLightbox(1);
    if (event.key === "ArrowLeft") navLightbox(-1);
  });
  let lbTouchX = 0;
  lightbox.addEventListener("touchstart", (e) => { lbTouchX = e.touches[0].clientX; }, { passive: true });
  lightbox.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - lbTouchX;
    if (Math.abs(dx) > 40) navLightbox(dx < 0 ? 1 : -1);
  });

  // ── Popups ──
  function wireSheet(sheetId, opener, onOpen) {
    const sheet = $(sheetId);
    opener?.addEventListener("click", () => {
      sheet.classList.add("open");
      onOpen?.();
    });
    sheet.querySelector("[data-close]").addEventListener("click", () => sheet.classList.remove("open"));
    sheet.addEventListener("click", (event) => { if (event.target === sheet) sheet.classList.remove("open"); });
  }
  wireSheet("statusSheet", $("tourProgress"));
  wireSheet("healthSheet", $("boxHealth"));
  wireSheet("albumSheet", $("boxAlbum"));

  // ── Karten (Minimap + Popup) ──
  let miniMap = null;
  let miniMarker = null;
  let bigMap = null;
  let bigMarker = null;

  function routeLatLngs(routeData, step = 4) {
    return routeData.points.filter((_, i) => i % step === 0).map((p) => [p.lat, p.lon]);
  }

  function posIcon() {
    return window.L.divIcon({
      className: "",
      html: `<div class="live-pos-marker"><div class="live-pos-marker__pulse"></div><div class="live-pos-marker__dot"></div></div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    });
  }

  function drawRoute(map, routeData, doneMeters, step) {
    const pts = routeData.points.filter((_, i) => i % step === 0);
    let split = pts.findIndex((p) => p.cumulativeDistanceMeters >= doneMeters);
    if (split < 1) split = 1;
    const toLL = (p) => [p.lat, p.lon];

    window.L.polyline(pts.slice(split).map(toLL), { color: "#90a4ae", weight: 3, opacity: 0.75, lineCap: "round" }).addTo(map);
    window.L.polyline(pts.slice(0, split + 1).map(toLL), { color: "#eb8f34", weight: 3.4, opacity: 0.95, lineCap: "round" }).addTo(map);
  }

  function initMaps() {
    if (!window.L || !state.routeData) return;

    miniMap = window.L.map("minimapMap", {
      zoomControl: false, attributionControl: false, dragging: false,
      scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false,
      boxZoom: false, keyboard: false, preferCanvas: true,
    });
    window.L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 19,
    }).addTo(miniMap);

    const done = (state.locationData?.routeMatch?.distanceDoneKm ?? 0) * 1000;
    drawRoute(miniMap, state.routeData, done, 24);
    miniMap.fitBounds([
      [state.routeData.bounds.minLat, state.routeData.bounds.minLon],
      [state.routeData.bounds.maxLat, state.routeData.bounds.maxLon],
    ], { padding: [4, 4] });

    wireSheet("mapSheet", $("minimap"), () => {
      if (!bigMap) {
        bigMap = window.L.map("bigmap", { zoomControl: true, attributionControl: false, preferCanvas: true });
        window.L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          subdomains: "abcd", maxZoom: 19,
        }).addTo(bigMap);
        window.L.control.attribution({ prefix: false })
          .addAttribution('© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>')
          .addTo(bigMap);
        drawRoute(bigMap, state.routeData, (state.locationData?.routeMatch?.distanceDoneKm ?? 0) * 1000, 4);
      }
      requestAnimationFrame(() => {
        bigMap.invalidateSize();
        if (state.locationData) {
          const ll = [state.locationData.latitude, state.locationData.longitude];
          if (bigMarker) bigMarker.setLatLng(ll);
          else bigMarker = window.L.marker(ll, { icon: posIcon(), zIndexOffset: 1000 }).addTo(bigMap);
          bigMap.setView(ll, 9);
        } else {
          bigMap.fitBounds([
            [state.routeData.bounds.minLat, state.routeData.bounds.minLon],
            [state.routeData.bounds.maxLat, state.routeData.bounds.maxLon],
          ], { padding: [18, 18] });
        }
      });
    });

    updateMapMarker();
  }

  function updateMapMarker() {
    if (!miniMap || !state.locationData) return;
    const ll = [state.locationData.latitude, state.locationData.longitude];
    if (miniMarker) miniMarker.setLatLng(ll);
    else miniMarker = window.L.circleMarker(ll, {
      radius: 4, color: "#fffdf8", weight: 1.5, fillColor: "#0c6b58", fillOpacity: 1,
    }).addTo(miniMap);
  }

  // ── Start ──
  state.routeData = await loadRouteData();
  state.countrySegments = buildCountrySegments(state.routeData);
  renderProgressTrack();

  loadPoiData()
    .then((poiData) => { state.poiData = poiData; renderPois(); })
    .catch(() => {});

  startPhotoService({
    onUpdate(photos) { state.photos = photos; renderPhotos(); },
    onError() { state.photos = []; renderPhotos(); },
  });

  startTourStatsService({
    onUpdate(stats) {
      state.stats = stats;
      renderStatsSurfaces();
    },
  });

  const provider = createLocationProvider({
    routeData: state.routeData,
    onUpdate(snapshot) {
      state.previousLocationData = state.locationData;
      state.locationData = mapLocationToRoute(state.routeData, snapshot);

      const movement = computeMovementStatus(state.locationData, state.previousLocationData);
      if (movement.isMoving) state.lastMovementAt = Date.now();

      const segIdx = currentCountryIndex();
      if (segIdx >= 0) applyCountry(state.countrySegments[segIdx].code);

      applyMode(computeMode());
      renderScene();
      renderBorder();
      renderPois();
      renderTimeline();
      updateMapMarker();

      reverseGeocode(snapshot.latitude, snapshot.longitude)
        .then((geo) => { if (geo) { state.geocodeData = geo; renderScene(); } })
        .catch(() => {});

      fetchWeather(snapshot.latitude, snapshot.longitude)
        .then((weather) => {
          state.weather = weather;
          applyMode(computeMode());
          renderScene();
        })
        .catch(() => {});
    },
    onError(message) {
      applyMode("stale");
      $("pauseText").textContent = message || "Keine Verbindung zum GPS-Tracker";
    },
  });

  await provider.start();

  if (window.L) initMaps();
  else window.addEventListener("load", initMaps, { once: true });

  // Frische-Anzeige und Zustand aktuell halten, auch ohne neue Fixes
  setInterval(() => {
    if (!state.locationData) return;
    applyMode(computeMode());
    renderScene();
  }, 60_000);

  window.addEventListener("pagehide", () => provider.stop());
  window.addEventListener("pageshow", (event) => { if (event.persisted) window.location.reload(); });

  // Vor der Abfahrt Countdown, danach Reisetag
  function renderTripDay() {
    const until = daysUntilStart();
    if (until == null) return;

    const chipDay = $("chipDay");
    chipDay.hidden = false;

    if (until > 0) {
      chipDay.textContent = until === 1 ? "🚴 Abfahrt morgen" : `🚴 Abfahrt in ${until} Tagen`;
      document.title = "Timo & Tino · bald geht's los";
      return;
    }

    const day = -until + 1;
    chipDay.textContent = `Tag ${day}`;
    document.title = `Timo & Tino · Tag ${day}`;
  }
  renderTripDay();
</script>
</body>
</html>
