<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Living Scene · Variante B · Comic</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #8fd3f4; }
  body { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }

  .scene-wrap { position: fixed; inset: 0; }
  svg.scene { width: 100%; height: 100%; display: block; }

  /* ── Parallax-Loops ── */
  .loop-clouds   { animation: slide 60s linear infinite; }
  .loop-hills-far{ animation: slide 90s linear infinite; }
  .loop-hills    { animation: slide 40s linear infinite; }
  .loop-props    { animation: slide 11s linear infinite; }
  .loop-dashes   { animation: slide 1.2s linear infinite; }
  .loop-grass    { animation: slide 7s linear infinite; }
  @keyframes slide { to { transform: translateX(-1200px); } }

  .spokes, .crank { animation: spin 0.65s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sun-rays { animation: spin 24s linear infinite; }

  .rider-bob { animation: bob 0.33s ease-in-out infinite alternate; }
  .rider-bob--b { animation-delay: -0.16s; }
  @keyframes bob { to { transform: translateY(-2.6px); } }

  .bubble { animation: bubble 2.4s ease-in-out infinite alternate; }
  @keyframes bubble { to { transform: translateY(-7px); } }

  .dog { animation: dogrun 0.5s ease-in-out infinite alternate; }
  @keyframes dogrun { to { transform: translateY(-4px); } }
  .dog-leg { animation: dogleg 0.25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
  .dog-leg--b { animation-delay: -0.125s; }
  @keyframes dogleg { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  .dog-tail { animation: tail 0.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom left; }
  @keyframes tail { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }

  .sweat { animation: sweat 0.9s ease-out infinite; }
  .sweat--2 { animation-delay: 0.45s; }
  @keyframes sweat {
    0% { transform: translate(0, 0); opacity: 0.9; }
    100% { transform: translate(-16px, -12px); opacity: 0; }
  }

  /* ── Tag / Nacht ── */
  .night-veil, .stars, .moon, .camp { opacity: 0; transition: opacity 1.4s ease; }
  .sun-group, .riders, .dog, .bubble { transition: opacity 1.3s ease; }
  .scene--night .night-veil, .scene--night .stars, .scene--night .moon, .scene--night .camp { opacity: 1; }
  .scene--night .sun-group, .scene--night .riders, .scene--night .dog, .scene--night .bubble { opacity: 0; }
  .scene--night [class^="loop-"] { animation-play-state: paused; }
  .star { animation: twinkle 2.2s ease-in-out infinite; }
  .star:nth-child(3n) { animation-delay: 0.8s; }
  .star:nth-child(3n+1) { animation-delay: 1.5s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .fire-glow { animation: fireglow 1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes fireglow { from { transform: scale(0.9); } to { transform: scale(1.1); } }
  .zzz { animation: zzz 2.8s ease-in-out infinite; opacity: 0; }
  .zzz--2 { animation-delay: 0.9s; }
  .zzz--3 { animation-delay: 1.8s; }
  @keyframes zzz {
    0% { transform: translate(0,0); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(14px, -26px); opacity: 0; }
  }

  /* ── HUD ── */
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    color: #27323a;
  }
  .hud__label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud button, .hud a {
    font: inherit; font-size: 16px; text-decoration: none; color: inherit;
    background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(8px);
    border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>
</head>
<body>
<div class="scene-wrap">

      <g class="spokes" stroke="#8a8478" stroke-width="2">

<div class="hud">
  <a href="./index.html" aria-label="Zurück zur Auswahl">←</a>
  <span class="hud__label" id="stateLabel">Variante B · Comic</span>
  <button id="toggleNight" aria-label="Tag/Nacht umschalten">🌙</button>
</div>

<script>
  const scene = document.getElementById("scene");
  const btn = document.getElementById("toggleNight");
  const label = document.getElementById("stateLabel");
  btn.addEventListener("click", () => {
    const night = scene.classList.toggle("scene--night");
    btn.textContent = night ? "☀️" : "🌙";
    label.textContent = night ? "🌙 Zzz… bis morgen früh!" : "Variante B · Comic";
  });
</script>
