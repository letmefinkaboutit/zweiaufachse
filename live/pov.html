<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />

<title>Living Scene · POV-Mockup · km 1.096</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #f7f1e7; }
  body { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }

  .scene-wrap { position: fixed; inset: 0; }
  svg.scene { width: 100%; height: 100%; display: block; }

  /* ── Pseudo-3D: alles skaliert vom Fluchtpunkt (400,560) weg ── */
  .fly {
    transform-box: view-box;
    transform-origin: 400px 560px;
    animation: fly var(--dur, 5.2s) linear infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }
  @keyframes fly {
    0%   { transform: scale(0.05); opacity: 0; }
    6%   { opacity: 1; }
    62%  { transform: scale(1.6); }
    100% { transform: scale(11); opacity: 1; }
  }
  .fly-dash {
    transform-box: view-box;
    transform-origin: 400px 560px;
    animation: flydash 3.2s linear infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }
  /* Mittelstreifen: streckt sich vor allem in die Laenge — sonst wird aus
     der Fahrbahnmarkierung in der Naehe ein breiter Balken */
  @keyframes flydash {
    0%   { transform: scale(0.08, 0.08); opacity: 0; }
    8%   { opacity: 0.7; }
    62%  { transform: scale(1.3, 1.9); }
    100% { transform: scale(4.5, 13); opacity: 0.7; }
  }

  /* ── Modul-Schild: kommt heran, haelt kurz lesbar, zieht vorbei ── */
  .fly-billboard {
    transform-box: view-box;
    transform-origin: 400px 560px;
    animation: billboardfly 9.5s linear infinite;
    opacity: 0;
  }
  @keyframes billboardfly {
    0%   { transform: scale(0.05); opacity: 0; }
    6%   { opacity: 1; }
    38%  { transform: scale(4.4); }
    72%  { transform: scale(4.9); }
    100% { transform: scale(14); opacity: 1; }
  }

  /* Umschaltbare Praesentation: Schilder an der Strecke vs. Karten im Himmel */
  body.mode-billboard .moment-stage { display: none; }
  body.mode-cards .fly-billboard { display: none; }

  /* ── Timo vor uns ── */
  .timo { transform-box: view-box; transform-origin: 400px 1000px; animation: sway 1.7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
  .calf-l { animation: pedal 0.42s ease-in-out infinite alternate; }
  .calf-r { animation: pedal 0.42s ease-in-out infinite alternate-reverse; }
  @keyframes pedal { from { transform: translateY(0); } to { transform: translateY(-16px); } }

  /* ── Eigenes Cockpit ── */
  .cockpit { animation: cockpitbob 0.48s ease-in-out infinite alternate; }
  @keyframes cockpitbob { to { transform: translateY(2px); } }

  .glint { animation: glint 3.2s ease-in-out infinite; }
  .glint:nth-child(2n) { animation-delay: 1.1s; }
  @keyframes glint { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
  .cloud-drift { animation: drift 90s linear infinite; }
  @keyframes drift { to { transform: translateX(-900px); } }

  /* ── Nacht ── */
  .night-veil, .stars, .moon, .camp { opacity: 0; transition: opacity 1.4s ease; }
  .sun-group, .timo { transition: opacity 1.3s ease; }
  .scene--night .night-veil, .scene--night .stars, .scene--night .moon, .scene--night .camp { opacity: 1; }
  .scene--night .sun-group, .scene--night .timo { opacity: 0; }
  .scene--night .fly, .scene--night .fly-dash, .scene--night .fly-billboard,
  .scene--night .calf-l, .scene--night .calf-r,
  .scene--night .cockpit, .scene--night .cloud-drift { animation-play-state: paused; }
  .hands { transition: opacity 1.2s ease; }
  .scene--night .hands { opacity: 0; }
  .fly-billboard { transition: opacity 1.2s ease; }
  .scene--night .fly-billboard { opacity: 0 !important; }
  .star { animation: twinkle 2.6s ease-in-out infinite; }
  .star:nth-child(3n) { animation-delay: 0.9s; }
  .star:nth-child(3n+1) { animation-delay: 1.7s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .fire-glow { animation: fireglow 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes fireglow { from { transform: scale(0.92); } to { transform: scale(1.08); } }

  /* ── Wetter ── */
  .rain, .extra-clouds, .fog { opacity: 0; transition: opacity 1.2s ease; }
  .scene--rain .rain { opacity: 1; }
  .scene--rain .sun-group, .scene--overcast .sun-group { opacity: 0.25; }
  .scene--rain .extra-clouds, .scene--overcast .extra-clouds { opacity: 1; }
  .scene--fog .fog { opacity: 0.85; }
  .raindrop { animation: rainfall 0.55s linear infinite; }
  @keyframes rainfall { to { transform: translate(-40px, 340px); } }

  /* ── Momente-Buehne ── */
  .moment-stage {
    position: fixed; left: 0; right: 0;
    top: calc(80px + env(safe-area-inset-top));
    display: flex; justify-content: center;
    pointer-events: none; z-index: 5;
  }
  .moment {
    position: absolute;
    width: min(67vw, 280px);
    opacity: 0;
    transform: translateY(18px) rotate(-2deg) scale(0.94);
    transition: opacity 0.8s ease, transform 0.9s cubic-bezier(0.18, 0.7, 0.3, 1.12);
  }
  .moment.show { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  .moment--photo {
    background: #fffdf8; border-radius: 6px; padding: 10px 10px 12px;
    box-shadow: 0 18px 42px rgba(29, 35, 38, 0.28);
    transform: translateY(18px) rotate(-4.5deg) scale(0.94);
  }
  .moment--photo.show { transform: translateY(0) rotate(-2.5deg) scale(1); }
  .moment--photo img {
    display: block; width: 100%; aspect-ratio: 4 / 3;
    object-fit: cover; border-radius: 3px; background: #e9e2d2;
  }
  .moment--photo .tape {
    position: absolute; top: -10px; left: 50%;
    width: 74px; height: 22px; transform: translateX(-50%) rotate(3deg);
    background: rgba(232, 217, 168, 0.85); border-radius: 2px;
  }
  .moment--card {
    background: rgba(255, 253, 248, 0.96); border-radius: 22px;
    padding: 16px 18px 15px; box-shadow: 0 18px 42px rgba(29, 35, 38, 0.24);
    text-align: center;
  }
  .moment__eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #58656b; margin-bottom: 6px;
  }
  .moment__eyebrow--ahead { color: #eb8f34; }
  .moment__eyebrow--border { color: #8a5ca7; }
  .moment__title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: #1f2a2f; }
  .moment__meta { font-size: 13.5px; color: #58656b; margin-top: 3px; font-weight: 600; }
  .moment__caption {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 9px; padding: 0 2px;
    font-size: 12.5px; font-weight: 700; color: #58656b;
  }
  .moment__flags { font-size: 42px; line-height: 1.15; margin: 4px 0 2px; }
  .moment__flags .arrow { font-size: 24px; color: #8a5ca7; vertical-align: middle; margin: 0 8px; }
  .moment__art { display: block; width: 100%; height: auto; margin: 6px 0 4px; }

  /* ── HUD ── */
  .hud-top {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 0 12px; pointer-events: none;
  }
  .chip {
    font-size: 12.5px; font-weight: 700; color: #1f2a2f;
    background: rgba(255, 253, 248, 0.88); backdrop-filter: blur(8px);
    padding: 7px 12px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(29, 35, 38, 0.08);
  }
  .chip--live { color: #0c6b58; }
  .chip--live .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #0c6b58; margin-right: 5px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    color: #1f2a2f; z-index: 6;
  }
  .hud__label {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    background: rgba(255, 253, 248, 0.85); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud button, .hud a {
    font: inherit; font-size: 16px; text-decoration: none; color: inherit;
    background: rgba(255, 253, 248, 0.85); backdrop-filter: blur(8px);
    border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>

      <path d="M0 0 L30 -8 L17 -45 L0 0 M30 -8 L57 -45 M17 -45 L57 -45 M57 -45 L74 0" stroke="#1c2529" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- ── Regen (faellt schraeg auf uns zu) ── -->
  <g class="rain">

      <g class="raindrop" style="animation-delay:-0.18s"><line x1="180" y1="-100" x2="170" y2="-62"/><line x1="390" y1="-35" x2="380" y2="3"/><line x1="590" y1="-115" x2="580" y2="-77"/><line x1="760" y1="-55" x2="750" y2="-17"/></g>
      <g class="raindrop" style="animation-delay:-0.36s"><line x1="40" y1="-145" x2="30" y2="-107"/><line x1="240" y1="-55" x2="230" y2="-17"/><line x1="440" y1="-160" x2="430" y2="-122"/><line x1="640" y1="-70" x2="630" y2="-32"/></g>
    </g>
    <g stroke="#7fa3b8" stroke-width="3" stroke-linecap="round" opacity="0.65" transform="translate(0,340)">
      <g class="raindrop"><line x1="130" y1="-60" x2="120" y2="-22"/><line x1="330" y1="-130" x2="320" y2="-92"/><line x1="530" y1="-40" x2="520" y2="-2"/><line x1="730" y1="-150" x2="720" y2="-112"/></g>
      <g class="raindrop" style="animation-delay:-0.27s"><line x1="220" y1="-100" x2="210" y2="-62"/><line x1="420" y1="-35" x2="410" y2="3"/><line x1="620" y1="-115" x2="610" y2="-77"/></g>
    </g>
    <g stroke="#7fa3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.6" transform="translate(0,680)">
      <g class="raindrop"><line x1="100" y1="-60" x2="88" y2="-16"/><line x1="360" y1="-120" x2="348" y2="-76"/><line x1="600" y1="-50" x2="588" y2="-6"/></g>
      <g class="raindrop" style="animation-delay:-0.3s"><line x1="250" y1="-90" x2="238" y2="-46"/><line x1="480" y1="-140" x2="468" y2="-96"/><line x1="710" y1="-80" x2="698" y2="-36"/></g>
    </g>
  </g>

  <!-- ── Nebel ueber dem Horizont ── -->
  <g class="fog">
    <rect y="440" width="800" height="200" fill="#e8e4da" opacity="0.6"/>
    <rect y="500" width="800" height="110" fill="#efece4" opacity="0.55"/>
  </g>

  <!-- ── Nachtschleier ueber der Landschaft ── -->
  <rect class="night-veil" x="0" y="380" width="800" height="820" fill="url(#veilFade)" style="mix-blend-mode: multiply;"/>

  <!-- ── Eigenes Cockpit (immer im Vordergrund) ── -->
  <g class="cockpit">
    <!-- Lenker -->
    <path d="M60 1122 Q140 1078 260 1072 L540 1072 Q660 1078 740 1122" stroke="#1c2529" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- Griffe + Haende (nachts geparkt: Haende weg) -->
    <path d="M78 1113 Q130 1085 200 1077" stroke="#2e3b42" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M722 1113 Q670 1085 600 1077" stroke="#2e3b42" stroke-width="30" fill="none" stroke-linecap="round"/>
    <g class="hands">
      <g fill="#e8b48c">
        <ellipse cx="150" cy="1092" rx="34" ry="26" transform="rotate(-16 150 1092)"/>
        <ellipse cx="650" cy="1092" rx="34" ry="26" transform="rotate(16 650 1092)"/>
      </g>
      <g fill="#d9a273">
        <ellipse cx="136" cy="1078" rx="9" ry="14" transform="rotate(-24 136 1078)"/>
        <ellipse cx="664" cy="1078" rx="9" ry="14" transform="rotate(24 664 1078)"/>
      </g>
    </g>
    <!-- Vorbau -->
    <rect x="384" y="1080" width="32" height="120" rx="10" fill="#1c2529"/>

    <!-- Fahrradcomputer -->
    <g transform="translate(400,1024)">
      <rect x="-108" y="-84" width="216" height="168" rx="20" fill="#1c2529"/>
      <rect x="-98" y="-74" width="196" height="148" rx="12" fill="#233036"/>
      <!-- Screen -->
      <rect x="-92" y="-68" width="184" height="136" rx="9" fill="#0e1a1e"/>
      <text id="dispSpeed" x="-14" y="-8" text-anchor="middle" font-size="52" font-weight="800" fill="#e8f4ee" font-family="Trebuchet MS, sans-serif">19</text>
      <text x="42" y="-8" font-size="16" font-weight="700" fill="#7d9990" font-family="Trebuchet MS, sans-serif">km/h</text>
      <line x1="-80" y1="6" x2="80" y2="6" stroke="#31454d" stroke-width="1.5"/>
      <text id="dispToday" x="-80" y="30" font-size="16.5" font-weight="700" fill="#bcd8cc" font-family="Trebuchet MS, sans-serif">heute 64 km</text>
      <text x="80" y="30" text-anchor="end" font-size="16.5" font-weight="700" fill="#bcd8cc" font-family="Trebuchet MS, sans-serif">52 %</text>
      <!-- Fortschrittsbalken -->
      <rect x="-80" y="40" width="160" height="7" rx="3.5" fill="#31454d"/>
      <rect x="-80" y="40" width="83" height="7" rx="3.5" fill="#3fa07c"/>
      <text id="dispBorder" x="0" y="62" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9db8ad" font-family="Trebuchet MS, sans-serif">🇲🇪 Grenze in 224 km</text>
      <!-- Halterung -->
      <rect x="-14" y="82" width="28" height="16" rx="5" fill="#1c2529"/>
    </g>
  </g>
</svg>

<!-- Momente-Buehne -->
<div class="moment-stage" id="momentStage">
  <div class="moment moment--card" data-moment="poi">
    <p class="moment__eyebrow moment__eyebrow--ahead">Voraus · Nächstes Highlight</p>
    <svg class="moment__art" viewBox="0 0 280 108" aria-hidden="true">
      <rect width="280" height="108" rx="12" fill="#f7ecd7"/>
      <circle cx="228" cy="30" r="16" fill="#f2a24b" opacity="0.85"/>
      <path d="M28 74 Q70 40 112 60 L112 108 L28 108 Z" fill="#c9bda4" opacity="0.5"/>
      <path d="M168 62 Q210 38 252 70 L252 108 L168 108 Z" fill="#c9bda4" opacity="0.5"/>
      <g stroke="#8a7a5e" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M75 78 Q140 30 205 78"/>
      </g>
      <path d="M75 78 Q140 30 205 78" transform="translate(0,10)" stroke="#8a7a5e" stroke-width="4" fill="none" opacity="0.5"/>
      <rect x="64" y="52" width="13" height="30" rx="2" fill="#8a7a5e"/>
      <rect x="203" y="52" width="13" height="30" rx="2" fill="#8a7a5e"/>
      <path d="M64 52 L70.5 42 L77 52 Z" fill="#8a7a5e"/>
      <path d="M203 52 L209.5 42 L216 52 Z" fill="#8a7a5e"/>
      <rect x="0" y="88" width="280" height="20" fill="#7fb4c9" opacity="0.75"/>
      <g stroke="#e6f2f5" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="100" y1="96" x2="126" y2="96"/><line x1="160" y1="100" x2="182" y2="100"/>
      </g>
    </svg>
    <p class="moment__title">Stari Most, Mostar</p>
    <p class="moment__meta">in 143 km · UNESCO-Welterbe</p>
  </div>

  <div class="moment moment--card" data-moment="border">
    <p class="moment__eyebrow moment__eyebrow--border">Voraus · Grenzübergang</p>
    <p class="moment__flags">🇧🇦<span class="arrow">→</span>🇲🇪</p>
    <p class="moment__title">Montenegro</p>
    <p class="moment__meta">in 224 km · Land 8 von 10</p>
  </div>
</div>

<!-- Daten-HUD -->
<div class="hud-top">
  <span class="chip chip--live"><span class="dot"></span><span id="chipState">in Bewegung</span></span>
  <span class="chip">🇧🇦 Donji Vakuf</span>
  <span class="chip" id="chipWeather">…°C</span>
  <span class="chip" id="chipFresh">vor 1 Min</span>
</div>

<div class="hud">
  <a href="./index.html" aria-label="Zurück zur Auswahl">←</a>
  <span class="hud__label">POV-Mockup · km 1.096 · Bosnien</span>
  <button id="toggleStage" aria-label="Schilder- oder Kartenmodus">🪧</button>
  <button id="toggleNight" aria-label="Tag/Nacht umschalten">🌙</button>
</div>

<script>
  const scene = document.getElementById("scene");
  const btn = document.getElementById("toggleNight");

  // Simulierte Live-Position: km 1096 (52 %), echt aus route-data.json abgeleitet
  const SIM = { lat: 44.24317, lon: 17.2959 };

  let nightOverride = null;
  btn.addEventListener("click", () => {
    nightOverride = !scene.classList.contains("scene--night");
    applyNight(nightOverride);
  });

  function applyNight(night) {
    scene.classList.toggle("scene--night", night);
    btn.textContent = night ? "☀️" : "🌙";
    document.getElementById("chipState").textContent = night ? "schläft 🌙" : "in Bewegung";
    document.getElementById("dispSpeed").textContent = night ? "--" : "19";
    if (lastWeather) applyWeather(lastWeather.code, lastWeather.temperature);
  }

  // ── Echtes Wetter (Open-Meteo). ?wx= und ?mode= erzwingen Zustaende. ──
  const params = new URLSearchParams(location.search);
  let lastWeather = null;

  function applyWeather(code, temperature) {
    lastWeather = { code, temperature };
    scene.classList.remove("scene--rain", "scene--overcast", "scene--fog");
    const isNight = scene.classList.contains("scene--night");
    let icon = isNight ? "🌙" : "☀️";
    if (code >= 51 && code <= 99) { scene.classList.add("scene--rain"); icon = "🌧"; }
    else if (code >= 45 && code <= 48) { scene.classList.add("scene--fog"); icon = "🌫"; }
    else if (code >= 2) { scene.classList.add("scene--overcast"); icon = isNight ? "☁️" : "⛅"; }
    document.getElementById("chipWeather").textContent =
      `${icon} ${temperature != null ? Math.round(temperature) + "°C" : ""}`.trim();
  }

  const forcedWx = params.get("wx");
  const forcedMode = params.get("mode");

  if (forcedWx) {
    applyWeather({ rain: 61, overcast: 3, fog: 45, clear: 0 }[forcedWx] ?? 0, 21);
  }
  if (forcedMode) {
    applyNight(forcedMode === "night");
    nightOverride = forcedMode === "night";
  }

  if (!forcedWx || !forcedMode) {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SIM.lat}&longitude=${SIM.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`)
      .then((r) => r.json())
      .then(({ current }) => {
        if (!forcedWx) applyWeather(current.weather_code, current.temperature_2m);
        if (!forcedMode && nightOverride === null) applyNight(current.is_day === 0);
      })
      .catch(() => { if (!forcedWx) applyWeather(0, 22); });
  }

  // ── Momente-Buehne (identisch zum Side-View-Mockup) ──
  const stage = document.getElementById("momentStage");
  const GALLERY_HOST = "https://zweiaufachse.thefinks.de";
  const FALLBACK_PHOTOS = [
    { thumbUrl: "/bilderupload/thumbs/s/IMG_3860.JPG", date: "2025-06-03T12:41:38" },
    { thumbUrl: "/bilderupload/thumbs/s/IMG_3848.JPG", date: "2025-06-02T10:12:00" },
  ];

  function createPhotoMoment(photo) {
    const el = document.createElement("div");
    el.className = "moment moment--photo";
    const dateLabel = photo.date
      ? new Date(photo.date).toLocaleDateString("de-DE", { day: "numeric", month: "long" })
      : "unterwegs";
    el.innerHTML = `
      <span class="tape"></span>
      <img src="${GALLERY_HOST}${photo.thumbUrl}" alt="Foto von unterwegs" />
      <div class="moment__caption"><span>📷 Erinnerung</span><span>${dateLabel}</span></div>
    `;
    el.querySelector("img").addEventListener("error", () => { el.dataset.dead = "1"; });
    stage.appendChild(el);
    return el;
  }

  function startMomentCarousel(photos) {
    const poiCard = stage.querySelector('[data-moment="poi"]');
    const borderCard = stage.querySelector('[data-moment="border"]');
    const photoCards = photos.slice(0, 4).map(createPhotoMoment);

    const sequence = [];
    const ahead = [poiCard, borderCard];
    const maxLen = Math.max(photoCards.length, ahead.length);
    for (let i = 0; i < maxLen; i++) {
      if (photoCards[i]) sequence.push(photoCards[i]);
      if (ahead[i % ahead.length] && i < ahead.length) sequence.push(ahead[i]);
    }
    if (!sequence.length) sequence.push(poiCard, borderCard);

    const SHOW_MS = 6000;
    const GAP_MS = 900;
    let idx = 0;

    function next() {
      let card = null;
      for (let tries = 0; tries < sequence.length; tries++) {
        const candidate = sequence[idx % sequence.length];
        idx += 1;
        if (candidate.dataset.dead !== "1") {
          card = candidate;
          break;
        }
      }
      if (!card) return;
      card.classList.add("show");
      setTimeout(() => card.classList.remove("show"), SHOW_MS);
      setTimeout(next, SHOW_MS + GAP_MS);
    }
    setTimeout(next, 1800);
  }

  // ── Praesentation: Karten-Modus als Standard (Entscheidung Daniel),
  // Schilder-Modus bleibt zum Vergleich per 🪧/🃏-Button erreichbar. ──
  document.body.classList.add("mode-cards");
  const stageBtn = document.getElementById("toggleStage");
  stageBtn.addEventListener("click", () => {
    const cardsNow = document.body.classList.toggle("mode-cards");
    document.body.classList.toggle("mode-billboard", !cardsNow);
    stageBtn.textContent = cardsNow ? "🪧" : "🃏";
  });

  const bbContent = document.getElementById("bbContent");
  const billboardEl = document.getElementById("billboard");
  let bbSeq = [];
  let bbIdx = 0;

  function billboardSvg(m) {
    if (m.type === "photo") {
      return `
        <rect x="-34" y="-26" width="68" height="62" rx="3" fill="#fffdf8" stroke="#d8d0c0" stroke-width="1"/>
        <image href="${m.url}" x="-30" y="-22" width="60" height="42" preserveAspectRatio="xMidYMid slice"/>
        <text x="-30" y="31" font-size="6" font-weight="700" fill="#58656b" font-family="Trebuchet MS, sans-serif">📷</text>
        <text x="30" y="31" text-anchor="end" font-size="6" font-weight="700" fill="#58656b" font-family="Trebuchet MS, sans-serif">Erinnerung · ${m.dateLabel}</text>
      `;
    }
    if (m.type === "border") {
      return `
        <rect x="-34" y="-26" width="68" height="62" rx="4" fill="#f6f2fb" stroke="#8a5ca7" stroke-width="2"/>
        <text x="0" y="-14" text-anchor="middle" font-size="6" font-weight="700" fill="#8a5ca7" font-family="Trebuchet MS, sans-serif" letter-spacing="0.8">GRENZE VORAUS</text>
        <text x="0" y="8" text-anchor="middle" font-size="15" font-family="sans-serif">🇧🇦→🇲🇪</text>
        <text x="0" y="21" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1f2a2f" font-family="Trebuchet MS, sans-serif">Montenegro</text>
        <text x="0" y="30" text-anchor="middle" font-size="6" font-weight="700" fill="#58656b" font-family="Trebuchet MS, sans-serif">in 224 km · Land 8 von 10</text>
      `;
    }
    // POI: braunes Touristik-Schild wie an echten Fernstrassen
    return `
      <rect x="-34" y="-26" width="68" height="62" rx="4" fill="#7a5c3e" stroke="#5e462f" stroke-width="2"/>
      <text x="0" y="-16" text-anchor="middle" font-size="6" font-weight="700" fill="#f3e8d8" font-family="Trebuchet MS, sans-serif" letter-spacing="0.8">VORAUS</text>
      <path d="M-22 4 Q0 -14 22 4" stroke="#f3e8d8" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <rect x="-25" y="-6" width="5" height="12" fill="#f3e8d8"/>
      <rect x="20" y="-6" width="5" height="12" fill="#f3e8d8"/>
      <line x1="-27" y1="7" x2="27" y2="7" stroke="#f3e8d8" stroke-width="1.6"/>
      <text x="0" y="20" text-anchor="middle" font-size="8.5" font-weight="800" fill="#f3e8d8" font-family="Trebuchet MS, sans-serif">Stari Most</text>
      <text x="0" y="29" text-anchor="middle" font-size="6" font-weight="700" fill="#e0cfb8" font-family="Trebuchet MS, sans-serif">Mostar · 143 km</text>
    `;
  }

  function renderNextBillboard() {
    if (!bbSeq.length) return;
    for (let tries = 0; tries < bbSeq.length; tries++) {
      const m = bbSeq[bbIdx % bbSeq.length];
      bbIdx += 1;
      if (!m.dead) {
        bbContent.innerHTML = billboardSvg(m);
        return;
      }
    }
  }
  // Inhalt wechselt genau dann, wenn das Schild wieder winzig am Horizont ist
  billboardEl.addEventListener("animationiteration", renderNextBillboard);

  function initMoments(photos) {
    const photoMoments = photos.slice(0, 4).map((p) => ({
      type: "photo",
      url: `${GALLERY_HOST}${p.thumbUrl}`,
      dateLabel: p.date
        ? new Date(p.date).toLocaleDateString("de-DE", { day: "numeric", month: "long" })
        : "unterwegs",
      dead: false,
    }));
    // Vorladen; kaputte Bilder fallen stumm aus der Rotation
    photoMoments.forEach((m) => {
      const img = new Image();
      img.addEventListener("error", () => { m.dead = true; });
      img.src = m.url;
    });

    const ahead = [{ type: "poi" }, { type: "border" }];
    bbSeq = [];
    for (let i = 0; i < Math.max(photoMoments.length, ahead.length); i++) {
      if (photoMoments[i]) bbSeq.push(photoMoments[i]);
      if (i < ahead.length) bbSeq.push(ahead[i]);
    }
    if (!bbSeq.length) bbSeq = ahead;

    renderNextBillboard();
    startMomentCarousel(photos);
  }

  fetch(`${GALLERY_HOST}/bilderupload/list.php`)
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((photos) => initMoments(photos.filter((p) => p.thumbUrl)))
    .catch(() => initMoments(FALLBACK_PHOTOS));

  // ── GPS-Leben: Tempo auf dem Radcomputer streut, Frische tickt ──
  let lastFixMin = 1;
  setInterval(() => {
    if (scene.classList.contains("scene--night")) return;
    const kph = 17 + Math.round(Math.random() * 5);
    document.getElementById("dispSpeed").textContent = String(kph);
  }, 4000);
  setInterval(() => {
    lastFixMin = lastFixMin >= 3 ? 1 : lastFixMin + 1;
    document.getElementById("chipFresh").textContent = `vor ${lastFixMin} Min`;
  }, 30000);
</script>
