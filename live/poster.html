<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Living Scene · Variante A · Travel-Poster</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #f7f1e7; }
  body { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }

  .scene-wrap { position: fixed; inset: 0; }
  svg.scene { width: 100%; height: 100%; display: block; }

  /* ── Parallax-Loops ── */
  .loop-clouds   { animation: slide 75s linear infinite; }
  .loop-mtn-far  { animation: slide 200s linear infinite; }
  .loop-mtn      { animation: slide 140s linear infinite; }
  .loop-hills    { animation: slide 55s linear infinite; }
  .loop-treeline { animation: slide 26s linear infinite; }
  .loop-props    { animation: slide 14s linear infinite; }
  .loop-dashes   { animation: slide 1.6s linear infinite; }
  .loop-grass    { animation: slide 9s linear infinite; }
  @keyframes slide { to { transform: translateX(-1200px); } }

  /* Raeder/Kurbel drehen um die eigene Mitte (bbox ist symmetrisch) */
  .spokes, .crank { animation: spin 0.8s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rider-bob { animation: bob 0.4s ease-in-out infinite alternate; }
  .rider-bob--b { animation-delay: -0.2s; }
  @keyframes bob { to { transform: translateY(-1.6px); } }

  .balloon { animation: balloon 6s ease-in-out infinite alternate; }
  @keyframes balloon { to { transform: translateY(-14px); } }

  .birds { animation: birds 38s linear infinite; }
  @keyframes birds { from { transform: translate(1250px, 40px); } to { transform: translate(-300px, -30px); } }

  /* ── Tag / Nacht ── */
  .night-veil, .stars, .moon, .camp { opacity: 0; transition: opacity 1.4s ease; }
  .sun-group, .riders { transition: opacity 1.3s ease; }
  .scene--night .night-veil, .scene--night .stars, .scene--night .moon, .scene--night .camp { opacity: 1; }
  .scene--night .sun-group, .scene--night .riders { opacity: 0; }
  .scene--night [class^="loop-"], .scene--night .birds, .scene--night .balloon { animation-play-state: paused; }
  .star { animation: twinkle 2.6s ease-in-out infinite; }
  .star:nth-child(3n) { animation-delay: 0.9s; }
  .star:nth-child(3n+1) { animation-delay: 1.7s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .fire-glow { animation: fireglow 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes fireglow { from { transform: scale(0.92); } to { transform: scale(1.08); } }

  /* ── HUD ── */
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    color: #1f2a2f;
  }
  .hud__label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    background: rgba(255, 253, 248, 0.85); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud button, .hud a {
    font: inherit; font-size: 16px; text-decoration: none; color: inherit;
    background: rgba(255, 253, 248, 0.85); backdrop-filter: blur(8px);
    border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>
</head>

<div class="hud">
  <a href="./index.html" aria-label="Zurück zur Auswahl">←</a>
  <span class="hud__label" id="stateLabel">Variante A · Travel-Poster</span>
  <button id="toggleNight" aria-label="Tag/Nacht umschalten">🌙</button>
</div>

<script>
  const scene = document.getElementById("scene");
  const btn = document.getElementById("toggleNight");
  const label = document.getElementById("stateLabel");
  btn.addEventListener("click", () => {
    const night = scene.classList.toggle("scene--night");
    btn.textContent = night ? "☀️" : "🌙";
    label.textContent = night ? "🌙 Gute Nacht, Timo & Tino" : "Variante A · Travel-Poster";
  });
</script>
